<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاستعلام عن فاتورة الكهرباء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #14b8a6;
      --accent: #f59e0b;
      --bg-grad-start: #0b1c33;
      --bg-grad-end: #0d9488;
      --card: #ffffff;
      --muted: #64748b;
      --text: #0f172a;
      --danger: #dc2626;
      --success: #059669;
      --radius: 24px;
      --radius-sm: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* زخرفة الخلفية المتحركة */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20,184,166,0.25) 0%, transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      pointer-events: none;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 40px 80px -15px rgba(2, 8, 23, 0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
      width: 100%;
      max-width: 560px;
      padding: 40px 34px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }

    .logo {
      width: 70px; height: 70px;
      margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #d1f8f4, #a7f3ee);
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(13,148,136,0.25);
    }
    .logo svg { width: 38px; height: 38px; }

    h1 {
      font-size: 1.6rem; font-weight: 800; text-align: center; color: var(--text);
      letter-spacing: -0.5px;
    }
    .subtitle {
      text-align: center; color: var(--muted);
      margin: 10px 0 30px; font-size: .95rem; font-weight: 500;
    }

    label {
      display: block; font-weight: 700; color: #334155;
      margin-bottom: 10px; font-size: .95rem;
    }

    .field {
      display: flex; gap: 12px;
      position: relative;
    }
    input {
      flex: 1;
      padding: 16px 18px;
      font-size: 1.15rem;
      font-family: inherit;
      font-weight: 700;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius-sm);
      letter-spacing: 3px;
      text-align: center;
      direction: ltr;
      color: var(--text);
      background: #f8fafc;
      transition: all .25s ease;
    }
    input::placeholder { color: #94a3b8; font-weight: 400; letter-spacing: 2px; }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 5px rgba(13, 148, 136, .15);
    }

    button {
      padding: 16px 30px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all .2s ease;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(13,148,136,0.35);
      position: relative;
      overflow: hidden;
    }
    button:hover {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      transform: translateY(-1px);
      box-shadow: 0 12px 25px rgba(13,148,136,0.45);
    }
    button:active { transform: translateY(0); }
    button:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .hint {
      margin-top: 10px; font-size: .82rem; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }

    .msg {
      margin-top: 24px; padding: 15px 18px; border-radius: var(--radius-sm);
      font-weight: 600; display: none; text-align: center;
      animation: slideDown .3s ease;
    }
    .msg.error {
      display: block; background: #fef2f2; color: var(--danger);
      border: 1px solid #fecaca;
    }
    .msg.info {
      display: block; background: #eff6ff; color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .result { margin-top: 26px; display: none; }

    .total {
      background: linear-gradient(135deg, #10b981, #0d9488);
      border: none;
      border-radius: var(--radius-sm);
      padding: 22px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(16,185,129,0.35);
      position: relative;
      overflow: hidden;
    }
    .total::before {
      content: '';
      position: absolute;
      width: 150px; height: 150px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      top: -50px; right: -50px;
    }
    .total .label { color: #d1fae5; font-weight: 700; font-size: 1rem; }
    .total .value {
      color: #fff; font-weight: 900; font-size: 2.4rem;
      margin-top: 6px; direction: ltr; letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .total .currency { font-size: 1.05rem; color: #a7f3d0; font-weight: 700; }

    .section-title {
      font-weight: 800; font-size: 1.05rem; color: var(--text);
      margin: 22px 0 10px; padding-right: 12px;
      border-right: 5px solid var(--primary);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title.unpaid { border-right-color: var(--danger); }
    .section-title.paid { border-right-color: var(--success); }

    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { padding: 11px 8px; text-align: center; border-bottom: 1px solid #f1f5f9; }
    th {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      color: #475569; font-weight: 800; font-size: .8rem;
      position: sticky; top: 0;
    }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: #f0fdfa; }
    tbody tr:last-child td { border-bottom: none; }

    .table-wrap {
      max-height: 280px; overflow-y: auto;
      border: 1px solid #e2e8f0; border-radius: var(--radius-sm);
      box-shadow: 0 2px 8px rgba(2,8,23,0.04);
    }
    .table-wrap::-webkit-scrollbar { width: 8px; }
    .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }

    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* badge لحالة الفاتورة غير المسددة */
    .badge-unpaid {
      display: inline-block;
      background: #fee2e2; color: #b91c1c;
      font-weight: 700; font-size: .78rem;
      padding: 3px 10px; border-radius: 20px;
    }

    @media (max-width: 640px) {
      .card { padding: 28px 22px; }
      h1 { font-size: 1.35rem; }
      .field { flex-direction: column; }
      button { padding: 15px; }
      input { letter-spacing: 2px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <h1>الاستعلام عن فاتورة الكهرباء</h1>
    <p class="subtitle">أدخل رقم الاشتراك المكون من 10 خانات لمعرفة المبلغ المستحق</p>

    <form id="lookupForm" novalidate>
      <label for="subscriber">رقم الاشتراك</label>
      <div class="field">
        <input id="subscriber" inputmode="numeric" maxlength="10" placeholder="0012345678"
               autocomplete="off" required />
        <button type="submit" id="searchBtn">بحث</button>
      </div>
      <p class="hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
        </svg>
        رقم الاشتراك موجود في أعلى فاتورة الكهرباء
      </p>
    </form>

    <div id="msg" class="msg"></div>

    <div id="result" class="result">
      <div class="total">
        <div class="label">مجموع الذمم</div>
        <div class="value"><span id="totalAmount"></span> <span class="currency">دينار</span></div>
      </div>

      <div id="unpaidSection" style="display:none">
        <div class="section-title unpaid">الفواتير غير المسددة</div>
        <div class="table-wrap">
          <table>
            <thead><tr id="unpaidHead"></tr></thead>
            <tbody id="unpaidBody"></tbody>
          </table>
        </div>
      </div>

      <div id="paidSection" style="display:none">
        <div class="section-title paid">الفواتير المسددة</div>
        <div class="table-wrap">
          <table>
            <thead><tr id="paidHead"></tr></thead>
            <tbody id="paidBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('lookupForm');
    const input = document.getElementById('subscriber');
    const btn = document.getElementById('searchBtn');
    const msg = document.getElementById('msg');
    const result = document.getElementById('result');

    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(0, 10);
    });

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    function renderTable(kind, grid) {
      const section = document.getElementById(kind + 'Section');
      if (!grid || !grid.rows.length) {
        section.style.display = 'none';
        return;
      }
      document.getElementById(kind + 'Head').innerHTML =
        grid.headers.map((h) => `<th>${h}</th>`).join('');
      document.getElementById(kind + 'Body').innerHTML = grid.rows
        .map((r) => `<tr>${r.map((c) => `<td>${c === 'غير مسددة' ? `<span class="badge-unpaid">${c}</span>` : c}</td>`).join('')}</tr>`)
        .join('');
      section.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.style.display = 'none';
      msg.className = 'msg';

      const subscriber = input.value.trim();
      if (!/^\d{10}$/.test(subscriber)) {
        showMsg('رقم الاشتراك يجب أن يتكون من 10 خانات رقمية', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        // عرض آخر نتيجة معروفة فوراً (إن وجدت) ثم جلب النتيجة الطازجة
        const snap = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscriber, mode: 'snapshot' }),
        });
        if (snap.status === 200) {
          showResult(await snap.json());
          showMsg('آخر نتيجة معروفة — جاري التحديث من موقع الشركة...', 'info');
        }

        const res = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscriber }),
        });
        const data = await res.json();

        msg.className = 'msg';
        if (!res.ok) {
          showMsg(data.error || 'حدث خطأ غير متوقع', 'error');
        } else if (data.status === 'no_invoices') {
          showMsg(data.message, 'info');
        } else {
          showResult(data);
        }
      } catch {
        showMsg('تعذر الاتصال بالخادم، تحقق من الشبكة وحاول مجدداً', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'بحث';
      }
    });

    function showResult(data) {
      document.getElementById('totalAmount').textContent =
        data.total !== null ? data.total : '—';
      renderTable('unpaid', data.unpaid);
      renderTable('paid', data.paid);
      result.style.display = 'block';
    }
  </script>
</body>
</html>

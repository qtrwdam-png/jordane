<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاستعلام عن فاتورة الكهرباء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --card: #ffffff;
      --muted: #64748b;
      --danger: #dc2626;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0b1220 0%, #0f766e 130%);
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 30px 70px rgba(2, 8, 23, 0.45);
      width: 100%;
      max-width: 520px;
      padding: 36px 30px;
    }
    .logo {
      width: 62px; height: 62px;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      background: #ecfdf5;
      border-radius: 50%;
    }
    h1 { font-size: 1.45rem; font-weight: 800; text-align: center; color: #0f172a; }
    .subtitle { text-align: center; color: var(--muted); margin: 8px 0 26px; font-size: .95rem; }
    label { display: block; font-weight: 700; color: #334155; margin-bottom: 8px; font-size: .95rem; }
    .field { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.1rem;
      font-family: inherit;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      letter-spacing: 2px;
      text-align: center;
      direction: ltr;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, .12);
    }
    button {
      padding: 14px 26px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      white-space: nowrap;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(.97); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .hint { margin-top: 8px; font-size: .82rem; color: var(--muted); }

    .msg { margin-top: 22px; padding: 14px 16px; border-radius: 12px; font-weight: 600; display: none; text-align: center; }
    .msg.error { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .msg.info  { display: block; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    .result { margin-top: 22px; display: none; }
    .total {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .total .label { color: #065f46; font-weight: 700; font-size: .95rem; }
    .total .value { color: #047857; font-weight: 800; font-size: 2rem; margin-top: 4px; direction: ltr; }
    .total .currency { font-size: 1rem; color: #059669; font-weight: 700; }
    .section-title {
      font-weight: 800; font-size: 1rem; color: #0f172a;
      margin: 18px 0 8px; padding-right: 8px;
      border-right: 4px solid var(--primary);
    }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: 9px 8px; text-align: center; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; color: #334155; font-weight: 700; }
    .table-wrap { max-height: 260px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; }

    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <h1>الاستعلام عن فاتورة الكهرباء</h1>
    <p class="subtitle">أدخل رقم الاشتراك المكون من 10 خانات لمعرفة المبلغ المستحق</p>

    <form id="lookupForm" novalidate>
      <label for="subscriber">رقم الاشتراك</label>
      <div class="field">
        <input id="subscriber" inputmode="numeric" maxlength="10" placeholder="0012345678"
               autocomplete="off" required />
        <button type="submit" id="searchBtn">بحث</button>
      </div>
      <p class="hint">رقم الاشتراك موجود في أعلى فاتورة الكهرباء</p>
    </form>

    <div id="msg" class="msg"></div>

    <div id="result" class="result">
      <div class="total">
        <div class="label">مجموع الذمم</div>
        <div class="value"><span id="totalAmount"></span> <span class="currency">دينار</span></div>
      </div>

      <div id="unpaidSection" style="display:none">
        <div class="section-title">الفواتير غير المسددة</div>
        <div class="table-wrap">
          <table>
            <thead><tr id="unpaidHead"></tr></thead>
            <tbody id="unpaidBody"></tbody>
          </table>
        </div>
      </div>

      <div id="paidSection" style="display:none">
        <div class="section-title">الفواتير المسددة</div>
        <div class="table-wrap">
          <table>
            <thead><tr id="paidHead"></tr></thead>
            <tbody id="paidBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('lookupForm');
    const input = document.getElementById('subscriber');
    const btn = document.getElementById('searchBtn');
    const msg = document.getElementById('msg');
    const result = document.getElementById('result');

    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(0, 10);
    });

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    function renderTable(kind, grid) {
      const section = document.getElementById(kind + 'Section');
      if (!grid || !grid.rows.length) {
        section.style.display = 'none';
        return;
      }
      document.getElementById(kind + 'Head').innerHTML =
        grid.headers.map((h) => `<th>${h}</th>`).join('');
      document.getElementById(kind + 'Body').innerHTML = grid.rows
        .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`)
        .join('');
      section.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.style.display = 'none';
      msg.className = 'msg';

      const subscriber = input.value.trim();
      if (!/^\d{10}$/.test(subscriber)) {
        showMsg('رقم الاشتراك يجب أن يتكون من 10 خانات رقمية', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        // عرض آخر نتيجة معروفة فوراً (إن وجدت) ثم جلب النتيجة الطازجة
        const snap = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscriber, mode: 'snapshot' }),
        });
        if (snap.status === 200) {
          showResult(await snap.json());
          showMsg('آخر نتيجة معروفة — جاري التحديث من موقع الشركة...', 'info');
        }

        const res = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscriber }),
        });
        const data = await res.json();

        msg.className = 'msg';
        if (!res.ok) {
          showMsg(data.error || 'حدث خطأ غير متوقع', 'error');
        } else if (data.status === 'no_invoices') {
          showMsg(data.message, 'info');
        } else {
          showResult(data);
        }
      } catch {
        showMsg('تعذر الاتصال بالخادم، تحقق من الشبكة وحاول مجدداً', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'بحث';
      }
    });

    function showResult(data) {
      document.getElementById('totalAmount').textContent =
        data.total !== null ? data.total : '—';
      renderTable('unpaid', data.unpaid);
      renderTable('paid', data.paid);
      result.style.display = 'block';
    }
  </script>
</body>
</html>
